# Mecanum Wheel Velocity Path
# Example velocity-based path configuration for mecanum wheels
# Duration: 30 seconds
#
# Supports three YAML formats:
# 1. Scalar: velocity_x: 0.3 (constant velocity)
# 2. Interpolation points: velocity_x: [[0, 0], [1, 0.3], [2, 0.3]]
# 3. Legacy coefficients:
#    - linear: velocity_x: {m: 0.1, b: 0.0} -> v(t) = m*t + b
#    - quadratic: velocity_x: {a: -0.01, b: -0.02, c: 0.3} -> v(t) = a*t² + b*t + c

path:
  name: "mecanum_velocity_example"
  description: "Example velocity profile for mecanum wheel simulation"
  duration: 30.0
  sample_rate_hz: 50  # Hz for wheel encoders

  segments:
    # Phase 1: Stand still
    - interval: [0.0, 2.0]
      velocity_x: 0.0
      velocity_y: 0.0
      omega: 0.0

    # Phase 2: Accelerate forward (linear ramp)
    - interval: [2.0, 5.0]
      velocity_x:
        m: 0.1   # acceleration: 0.1 m/s per second
        b: 0.0   # start from 0 m/s
      velocity_y: 0.0
      omega: 0.0

    # Phase 3: Cruise at constant velocity
    - interval: [5.0, 10.0]
      velocity_x: 0.3
      velocity_y: 0.0
      omega: 0.0

    # Phase 4: Strafe right while moving forward 
    # Omega creates rotation, Wheel inputs create translation/motion.
    # Additive logic sums them up.
    - interval: [10.0, 15.0]
      omega: 0.0 # Angular velocity
      velocity_fl: 3.0 # Front Left
      velocity_fr: -3.0 # Front Right
      velocity_rl: -3.0 # Rear Left
      velocity_rr: 3.0 # Rear Right

    # Phase 5: Rotate while moving (circular motion) - Standard keys
    - interval: [15.0, 20.0]
      velocity_x: 0.3 # Linear velocity
      velocity_y: 0.0 # Linear velocity
      omega: 0.4 # Angular velocity

    # Phase 6: Decelerate with quadratic profile
    - interval: [20.0, 25.0]
      velocity_x:
        a: -0.01      # quadratic coefficient
        b: -0.02      # linear coefficient
        c: 0.3        # starting velocity
      velocity_y: 0.0
      omega: 0.0

    # Phase 7: Stop
    - interval: [25.0, 30.0]
      velocity_x: 0.0
      velocity_y: 0.0
      omega: 0.0
