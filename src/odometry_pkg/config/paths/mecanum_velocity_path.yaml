# Mecanum Wheel Velocity Path
# Example velocity-based path configuration for mecanum wheels
# Duration: 30 seconds
#
# For mecanum wheels, we specify velocity values (not acceleration)
# The wheel encoder simulator outputs these velocities directly

path:
  name: "mecanum_velocity_example"
  description: "Example velocity profile for mecanum wheel simulation"
  duration: 30.0
  sample_rate_hz: 50  # 50 Hz for wheel encoders

  # For mecanum wheels: specify velocity values (X, Y, omega)
  # velocity_x: forward/backward (m/s)
  # velocity_y: left/right strafe (m/s)
  # omega: rotation (rad/s)
  segments:
    # Phase 1: Stand still
    - interval: [0.0, 2.0]
      type: constant
      velocity_x: 0.0
      velocity_y: 0.0
      omega: 0.0

    # Phase 2: Accelerate forward linearly
    - interval: [2.0, 5.0]
      type: linear
      velocity_x:
        m: 0.1  # m/s² acceleration
        b: 0.0  # start from 0
      velocity_y: 0.0
      omega: 0.0

    # Phase 3: Cruise at constant velocity
    - interval: [5.0, 10.0]
      type: constant
      velocity_x: 0.3
      velocity_y: 0.0
      omega: 0.0

    # Phase 4: Strafe right while moving forward
    - interval: [10.0, 15.0]
      type: constant
      velocity_x: 0.2
      velocity_y: 0.2
      omega: 0.0

    # Phase 5: Rotate while moving (circular motion)
    - interval: [15.0, 20.0]
      type: constant
      velocity_x: 0.3
      velocity_y: 0.0
      omega: 0.0

    # Phase 6: Decelerate with parabolic profile
    - interval: [20.0, 25.0]
      type: parabolic
      velocity_x:
        a: -0.01      # deceleration curve
        b: -0.02
        c: 0.3        # starting velocity
      velocity_y: 0.0
      omega: 0.0

    # Phase 7: Stop
    - interval: [25.0, 30.0]
      type: constant
      velocity_x: 0.0
      velocity_y: 0.0
      omega: 0.0
