# IMU Parabolic (Quadratic) Acceleration Path
# Assignment 4 - Third file (quadratic acceleration)
# Duration: 30 seconds, measurements every 100ms
#
# Interval [0,5] acceleration = 0
# Interval [5,9] acceleration = -0.025 * (x - 5)(x - 9)
# Interval [9,15] acceleration = 0
# Interval [15,19] acceleration = 0.025 * (x - 15)(x - 19)
# Interval [19,30] acceleration = 0
#
# Expanding the formulas:
# -0.025 * (x-5)(x-9) = -0.025 * (x² - 14x + 45) = -0.025x² + 0.35x - 1.125
# But using relative time t_rel = t - t_start:
# For [5,9]: -0.025 * t_rel * (t_rel - 4) = -0.025 * (t_rel² - 4*t_rel) = -0.025*t_rel² + 0.1*t_rel
# At t_rel=0: a=0, at t_rel=2: a = -0.025*4 + 0.2 = 0.1 (max), at t_rel=4: a=0

path:
  name: "parabolic_acceleration"
  description: "Parabolic (quadratic) acceleration profile for IMU simulation"
  duration: 30.0
  sample_rate_hz: 5  # 100ms intervals = 10 Hz

  # For parabolic type: a(t) = a * t_rel² + b * t_rel + c
  # where t_rel = t - t_start
  segments:
    - interval: [0.0, 5.0]
      type: constant
      accel_x: 0.0
      accel_y: 0.0
      accel_z: 0.0

    - interval: [5.0, 9.0]
      type: parabolic
      # a(t) = -0.025 * (t-5)(t-9) with t_rel = t - 5
      # = -0.025 * t_rel * (t_rel - 4)
      # = -0.025 * t_rel² + 0.1 * t_rel
      # So: a=-0.025, b=0.1, c=0
      accel_x:
        a: -0.025
        b: 0.1
        c: 0.0
      accel_y: 0.0
      accel_z: 0.0

    - interval: [9.0, 15.0]
      type: constant
      accel_x: 0.0
      accel_y: 0.0
      accel_z: 0.0

    - interval: [15.0, 19.0]
      type: parabolic
      # a(t) = 0.025 * (t-15)(t-19) with t_rel = t - 15
      # = 0.025 * t_rel * (t_rel - 4)
      # = 0.025 * t_rel² - 0.1 * t_rel
      # So: a=0.025, b=-0.1, c=0
      accel_x:
        a: 0.025
        b: -0.1
        c: 0.0
      accel_y: 0.0
      accel_z: 0.0

    - interval: [19.0, 30.0]
      type: constant
      accel_x: 0.0
      accel_y: 0.0
      accel_z: 0.0
